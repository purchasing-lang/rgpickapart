<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RG Checklist">
<meta name="theme-color" content="#f2f2f7">
<title>RG Checklist</title>
<style>
:root{
  --bg:#f2f2f7;--surface:#fff;--border:rgba(0,0,0,0.10);
  --text:#1c1c1e;--text2:#6c6c70;--text3:#aeaeb2;
  --green:#28a745;--green-bg:rgba(40,167,69,0.12);
  --red:#dc3545;--red-bg:rgba(220,53,69,0.12);
  --orange:#f4650a;--orange-bg:rgba(244,101,10,0.12);
  --purple:#7a4cf5;--purple-bg:rgba(122,76,245,0.12);
  --blue:#0071e3;--blue-bg:rgba(0,113,227,0.10);
  --font:-apple-system,'Helvetica Neue',sans-serif;
  --mono:'Menlo','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px}

/* header */
header{
  background:rgba(242,242,247,.96);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;gap:8px;
}
.logo{font-size:14px;font-weight:700}
.counts{display:flex;gap:5px}
.cpill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.cp-p{background:var(--orange-bg);color:var(--orange)}
.cp-d{background:var(--green-bg);color:var(--green)}

/* content */
.content{padding:8px 8px 80px}

/* vehicle block */
.vb{background:var(--surface);border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.07);margin-bottom:8px;overflow:hidden}

.vh{
  display:flex;align-items:center;gap:6px;
  padding:7px 10px;border-bottom:1px solid rgba(0,0,0,.06);
}
.vh.done{background:var(--green-bg)}
.vm{flex:1;min-width:0}
.vrs{font-size:10px;color:var(--text2);font-family:var(--mono)}
.vn{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.done-btn{
  flex-shrink:0;border:1.5px solid var(--border);background:var(--bg);
  border-radius:7px;font-size:11px;font-weight:700;padding:4px 9px;
  cursor:pointer;color:var(--text2);white-space:nowrap;
}
.done-btn.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.cam-btn{flex-shrink:0;border:1.5px solid var(--border);background:var(--bg);border-radius:7px;font-size:15px;padding:3px 7px;cursor:pointer;line-height:1}

/* vehicle note */
.vnote{padding:4px 10px;font-size:11px;color:var(--text2);background:var(--blue-bg);border-bottom:1px solid rgba(0,0,0,.04);line-height:1.4}

/* part row — one tight line */
.pr{
  display:flex;align-items:center;gap:6px;
  padding:5px 10px;border-bottom:1px solid rgba(0,0,0,.04);
  min-height:36px;
}
.pr:last-child{border-bottom:none}

/* left status dot */
.ps{width:16px;flex-shrink:0;text-align:center;font-size:13px;line-height:1}

/* part name */
.pn{flex:1;font-size:12px;line-height:1.3;word-break:break-word}
.pn.done{text-decoration:line-through;color:var(--text3)}
.pn.faded{color:var(--text3)}

/* 3 status buttons */
.pbtns{display:flex;gap:3px;flex-shrink:0}
.pb{
  height:34px;padding:0 10px;
  border:1.5px solid var(--border);
  border-radius:6px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap;font-family:var(--font);
  transition:background .1s,border-color .1s;
  -webkit-user-select:none;user-select:none;
}
.pb:active{opacity:.7}
.pb.a-complete  {background:var(--green-bg) ;border-color:var(--green) ;color:var(--green)}
.pb.a-missing   {background:var(--red-bg)   ;border-color:var(--red)   ;color:var(--red)}
.pb.a-no_remove {background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}

.no-parts{padding:6px 10px;font-size:11px;color:var(--text3);font-style:italic}
.sec-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:8px 10px 3px}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:60px 20px;color:var(--text3)}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--text3);line-height:1.7}
</style>
</head>
<body>

<header>
  <div class="logo">RG Checklist</div>
  <div class="counts">
    <span class="cpill cp-p" id="cPend">—</span>
    <span class="cpill cp-d" id="cDone">—</span>
    <button onclick="load()" style="background:none;border:1px solid rgba(0,0,0,.12);border-radius:20px;font-size:10px;font-weight:700;padding:2px 8px;cursor:pointer;color:var(--text2)">↻</button>
  </div>
</header>

<div class="content" id="content">
  <div class="loading"><div class="spin"></div>Loading…</div>
</div>

<script>
const SURL = "https://maxvxqovqlugnifrabvy.supabase.co";
const SKEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1heHZ4cW92cWx1Z25pZnJhYnZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MzU5NDgsImV4cCI6MjA4OTAxMTk0OH0.XILjOkLmwd9qF_DlKZLmsUmRX-UPMMW9DwCTzF6k9_I";

const H = {"apikey":SKEY,"Authorization":`Bearer ${SKEY}`};

async function get(path){
  const r = await fetch(SURL+path,{headers:H});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function patchDB(table,filter,body){
  const r = await fetch(`${SURL}/rest/v1/${table}?${filter}`,{
    method:"PATCH",
    headers:{...H,"Content-Type":"application/json","Prefer":"return=representation"},
    body:JSON.stringify(body)
  });
  if(!r.ok){ const t=await r.text(); console.error("patchDB failed:",t); throw new Error(t); }
  const rows=await r.json();
  if(!Array.isArray(rows)||!rows.length) throw new Error("Not saved — record not found. Try refreshing.");
}

// status config — 3 buttons for the worker
const ST = [
  {k:"complete",  icon:"✓", cls:"a-complete", label:"Got it"},
  {k:"missing",   icon:"✗", cls:"a-missing",  label:"Not there"},
  {k:"no_remove", icon:"⊘", cls:"a-no_remove",label:"Can't"},
];
// icons for all possible status values (including legacy)
const ST_ICON = {complete:"✓",broken:"⚠",missing:"✗",location:"?",no_remove:"⊘"};

let items = []; // [{stock, flag, note, checklist_status, vehicle:{}, parts:[]}]

async function load(){
  const el = document.getElementById("content");
  try{
    const flags = await get("/rest/v1/vehicle_flags?flag=neq.incorrect&archived_at=is.null&select=stock,flag,note,checklist_status&order=stock.asc");
    if(!flags.length){
      el.innerHTML=`<div class="empty">No flagged vehicles yet.<br>Flag vehicles in the dashboard first.</div>`;
      updateCounts(); return;
    }
    const stocks = flags.map(f=>f.stock);
    const vrows = await get(`/rest/v1/vehicles?stock=in.(${stocks.join(",")})&select=stock,year,make,model,row`);
    let parts=[];
    try{ parts=await get(`/rest/v1/parts_list?stock_num=in.(${stocks.join(",")})&select=id,stock_num,part,status&order=id.asc`); }catch(e){}
    const vm={};
    for(const v of vrows) vm[v.stock]=v;
    items = flags
      .map(f=>({...f, vehicle:vm[f.stock]||null, parts:parts.filter(p=>Number(p.stock_num)===f.stock)}))
      .filter(f=>f.vehicle)
      .sort((a,b)=>(a.vehicle.row??9999)-(b.vehicle.row??9999)||a.stock-b.stock);
    updateCounts();
    render();
  }catch(e){
    el.innerHTML=`<div class="empty">⚠️ ${e.message}</div>`;
  }
}

function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function render(){
  const el = document.getElementById("content");
  const int = items.filter(i=>i.flag==="interested");
  const wk  = items.filter(i=>i.flag==="worked");
  let h = "";
  if(int.length){ h+=`<div class="sec-lbl">⭐ Interested</div>`+int.map(vBlock).join(""); }
  if(wk.length) { h+=`<div class="sec-lbl">✓ Worked On</div>`  +wk.map(vBlock).join(""); }
  el.innerHTML = h || `<div class="empty">No vehicles.</div>`;
}

function vBlock(item){
  const v=item.vehicle, done=item.checklist_status==="complete";
  const vname=`${v.year||""} ${v.make||""} ${v.model||""}`.trim().replace(/'/g,"\\'");
  const partsHtml = item.parts.length
    ? item.parts.map(partRow).join("")
    : `<div class="no-parts">No parts — add in dashboard Parts tab</div>`;
  return `<div class="vb" id="vb-${item.stock}">
    <div class="vh${done?" done":""}">
      <div class="vm">
        <div class="vrs">${v.row?"Row "+v.row:"—"} · STK${item.stock}</div>
        <div class="vn">${v.year||"?"} ${v.make||""} ${v.model||""}</div>
      </div>
      <button class="done-btn${done?" on":""}" onclick="tapDone(${item.stock})">${done?"✓ Done":"Done"}</button>
      <button class="cam-btn" onclick="triggerPhoto(${item.stock})" title="Add photo">📷</button>
      <input type="file" id="fi-${item.stock}" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(${item.stock},'${vname}',this)">
    </div>
    ${item.note?`<div class="vnote">${esc(item.note)}</div>`:""}
    ${partsHtml}
  </div>`;
}

function partRow(p){
  const st=p.status||"pending";
  const icon=ST_ICON[st]||"○";
  const btns=ST.map(s=>`<button type="button" class="pb${st===s.k?" "+s.cls:""}" onclick="tapPart('${p.id}','${s.k}')">${s.icon} ${s.label}</button>`).join("");
  const nameCls=st==="complete"?"done":st==="missing"||st==="no_remove"?"faded":"";
  const safeId=String(p.id).replace(/[^a-zA-Z0-9_-]/g,"_");
  return `<div class="pr" id="pr-${safeId}">
    <span class="ps">${icon}</span>
    <span class="pn${nameCls?" "+nameCls:""}">${esc(p.part)}</span>
    <div class="pbtns">${btns}</div>
  </div>`;
}

function updateCounts(){
  const done=items.filter(i=>i.checklist_status==="complete").length;
  document.getElementById("cPend").textContent=(items.length-done)+" pending";
  document.getElementById("cDone").textContent=done+" done";
}

async function tapDone(stock){
  const item=items.find(i=>i.stock===stock); if(!item) return;
  const ns=item.checklist_status==="complete"?null:"complete";
  item.checklist_status=ns;
  const vb=document.getElementById(`vb-${stock}`);
  if(vb){
    const vh=vb.querySelector(".vh"), btn=vb.querySelector(".done-btn");
    if(ns){ vh.classList.add("done"); btn.classList.add("on"); btn.textContent="✓ Done"; }
    else  { vh.classList.remove("done"); btn.classList.remove("on"); btn.textContent="Done"; }
  }
  updateCounts();
  try{ await patchDB("vehicle_flags",`stock=eq.${stock}`,{checklist_status:ns}); }
  catch(e){ alert("Save error: "+e.message); }
}

async function tapPart(id, statusKey){
  let part=null;
  for(const item of items){ part=item.parts.find(p=>String(p.id)===String(id)); if(part) break; }
  if(!part) return;
  const ns=part.status===statusKey?"pending":statusKey;
  part.status=ns;
  const safeId=String(id).replace(/[^a-zA-Z0-9_-]/g,"_");
  const row=document.getElementById(`pr-${safeId}`);
  if(row){
    const icon=row.querySelector(".ps"), name=row.querySelector(".pn");
    if(icon) icon.textContent=ST_ICON[ns]||"○";
    if(name){ name.className="pn"; if(ns==="complete") name.classList.add("done"); else if(ns==="missing"||ns==="no_remove") name.classList.add("faded"); }
    const btnsEl=row.querySelector(".pbtns");
    if(btnsEl) btnsEl.innerHTML=ST.map(s=>`<button type="button" class="pb${ns===s.k?" "+s.cls:""}" onclick="tapPart('${id}','${s.k}')">${s.icon} ${s.label}</button>`).join("");
  }
  try{ await patchDB("parts_list",`id=eq.${id}`,{status:ns}); }
  catch(e){ alert("Save error: "+e.message); }
}

function triggerPhoto(stock){ document.getElementById('fi-'+stock)?.click(); }

async function handlePhoto(stock, vname, input){
  const file=input.files[0]; if(!file) return;
  const btn=document.querySelector(`#vb-${stock} .cam-btn`);
  if(btn){btn.textContent='⏳';btn.disabled=true;}
  try{
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
    const date=new Date().toISOString().slice(0,10);
    const safeName=(vname||String(stock)).replace(/[^a-zA-Z0-9]/g,'-').replace(/-+/g,'-');
    const path=`${date}_STK${stock}_${safeName}_${Date.now()}.${ext}`;
    const up=await fetch(`${SURL}/storage/v1/object/photos/${path}`,{
      method:'POST',headers:{...H,'Content-Type':file.type||'image/jpeg'},body:file});
    if(!up.ok) throw new Error(await up.text());
    const url=`${SURL}/storage/v1/object/public/photos/${path}`;
    const ins=await fetch(`${SURL}/rest/v1/vehicle_photos`,{
      method:'POST',headers:{...H,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({stock_num:String(stock),photo_url:url})});
    if(!ins.ok) throw new Error(await ins.text());
    if(btn){btn.textContent='✓📷';btn.disabled=false;}
  }catch(e){
    alert('Upload failed: '+e.message);
    if(btn){btn.textContent='📷';btn.disabled=false;}
  }
  input.value='';
}

load();

// Auto-refresh when phone wakes or user switches back to this tab
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") load(); });
</script>
</body>
</html>
